name: Debloat Safety CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  safety-verification:
    name: Safety Guard & Debloat Recovery Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Verify PackageSafetyGuard, Debloat, and Launcher Recovery unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "com.MyMote.tv.debloat.*" --tests "com.MyMote.tv.tvhome.*"

      - name: Run full unit test suite
        run: ./gradlew :app:testDebugUnitTest

      - name: Run Android Lint check
        run: ./gradlew :app:lintDebug

      - name: Static check — enforce safety guard, fail-closed persistence, and no guessing invariants
        run: |
          python3 - <<'PY'
          import pathlib, sys

          catalog = pathlib.Path("app/src/main/java/com/MyMote/tv/debloat/CleanYourTvPackageCatalog.kt").read_text()
          guard = pathlib.Path("app/src/main/java/com/MyMote/tv/debloat/PackageSafetyGuard.kt").read_text()
          scanner = pathlib.Path("app/src/main/java/com/MyMote/tv/debloat/TvPackageScanner.kt").read_text()
          debloat = pathlib.Path("app/src/main/java/com/MyMote/tv/debloat/DebloatManager.kt").read_text()
          launcher = pathlib.Path("app/src/main/java/com/MyMote/tv/tvhome/CleanYourTvLauncherManager.kt").read_text()

          # Ensure replacement launcher flag never allows stock launcher bypass
          if "isStockLauncher && !replacementReady" in guard or "isStockLauncher && !replacementReady" in scanner:
              print("FAIL: Stock launcher bypass based on replacementReady still present!")
              sys.exit(1)

          # Ensure no memory-only HOME backup fallback or /.MainActivity guessing
          if "memoryOrigPkg" in launcher or "memoryOrigAct" in launcher:
              print("FAIL: RAM-only original HOME fallback present in CleanYourTvLauncherManager!")
              sys.exit(1)
          if "/.MainActivity" in launcher:
              print("FAIL: Hardcoded /.MainActivity guessing present in CleanYourTvLauncherManager!")
              sys.exit(1)

          # Ensure listSystemPackages().getOrDefault(emptySet()) silent bypass is absent
          if "listSystemPackages().getOrDefault" in scanner or "listSystemPackages().getOrDefault" in debloat:
              print("FAIL: Silent listSystemPackages().getOrDefault fallback present!")
              sys.exit(1)

          critical_pkgs = [
              "com.google.android.permissioncontroller",
              "com.android.permissioncontroller",
              "com.google.android.packageinstaller",
              "com.android.packageinstaller",
              "com.google.android.ext.services",
              "com.android.ext.services",
              "com.google.android.ext.shared",
              "com.android.ext.shared",
              "com.google.android.modulemetadata",
              "com.android.modulemetadata",
              "com.google.android.tungsten.setupwraith",
              "com.google.android.tvlauncher",
              "com.google.android.apps.tv.launcherx",
              "com.mitv.tvhome",
          ]
          for pkg in critical_pkgs:
              if pkg not in catalog:
                  print(f"FAIL: Critical package {pkg} missing from CleanYourTvPackageCatalog.kt")
                  sys.exit(1)

          print("Static catalog, launcher persistence, & safety guard checks passed.")
          PY
